[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mission5-rag"
version = "0.1.0"
description = "AI Agentathon Mission 5 - RAG and Knowledge Agents"
requires-python = ">=3.11, <3.13"
dependencies = [
    "langchain==1.2.10",
    "langchain-openai==1.1.10",
    "langchain-deepseek>=1.0.1,<2.0",
    "langchain-community==0.4.1",
    "pypdf==4.3.1",
    "faiss-cpu==1.8.0.post1",
    "tiktoken==0.7.0",
    "python-dotenv==1.0.1",
    "numpy==1.26.4",
    "gradio>=4.0.0",
]

[tool.uv]
package = false
