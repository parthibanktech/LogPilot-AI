name: LogPilot AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full Application Verification Suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python verify_full_application.py

      - name: Build Docker Image
        run: |
          docker build -t logpilot-ai:latest .

      - name: Test Docker Health Check
        run: |
          docker run -d -p 8000:8000 --name test-app -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" logpilot-ai:latest
          sleep 10
          curl -f http://localhost:8000/api/health || exit 1
          docker stop test-app && docker rm test-app

  deploy-render:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && secrets.RENDER_DEPLOY_HOOK_URL != ''
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Cloud Auto-Deploy Webhook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
